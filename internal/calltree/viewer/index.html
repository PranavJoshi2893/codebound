<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codebound Call Graph</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; font-family: sans-serif; color: #202124; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.75rem; border-bottom: 1px solid #ddd; background: #f7f7f7; }
    button { min-width: 2.5rem; min-height: 2.5rem; padding: 0.4rem 0.75rem; font: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible, #viewport:focus-visible { outline: 3px solid #2563eb; outline-offset: -3px; }
    output { min-width: 6rem; text-align: center; font-variant-numeric: tabular-nums; }
    #graph-help { margin: 0; font-size: 0.875rem; color: #555; }
    #viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }
    #viewport.dragging { cursor: grabbing; }
    #graph { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: 0 0; pointer-events: none; }
  </style>
  <script src="viewer.js" defer></script>
</head>
<body>
  <div class="controls" role="group" aria-label="Graph controls">
    <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out (-)" disabled>−</button>
    <output id="zoom-level" aria-label="Zoom level" aria-live="polite">Loading…</output>
    <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in (+)" disabled>+</button>
    <button id="fit" type="button" title="Fit entire graph (0 or Home)" disabled>Fit</button>
    <p id="graph-help">Scroll to zoom · Drag to pan · +/− to zoom · Arrows to pan · 0 to fit</p>
    <noscript>Enable JavaScript to zoom and pan.</noscript>
  </div>
  <main id="viewport" tabindex="0" aria-label="Call graph viewer" aria-describedby="graph-help">
    <img id="graph" src="calltree.svg" alt="Call graph" draggable="false">
  </main>
</body>
</html>
